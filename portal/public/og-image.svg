<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  
  <!-- Grain texture overlay -->
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="1200" height="630" fill="#09090b" opacity="0.015" filter="url(#noise)"/>
  
  <!-- Logo (emerald 'e' with arrow) -->
  <g transform="translate(100, 180)">
    <path d="M40 15C26 15 15 26 15 40C15 54 26 65 40 65C45.5 65 50.6 63 54.5 59.5" 
          stroke="#10b981" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M15 40H40" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 28L52 15M52 15L39 15M52 15L39 28" 
          stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="220" y="245" font-family="system-ui, -apple-system, sans-serif" 
        font-size="88" font-weight="700" fill="#fafafa" letter-spacing="-0.02em">
    eCunga
  </text>
  
  <text x="100" y="355" font-family="system-ui, -apple-system, sans-serif" 
        font-size="48" font-weight="600" fill="#fafafa">
    Two apps. One hub.
  </text>
  
  <text x="100" y="425" font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" fill="#71717a">
    Track your trades and manage your budget.
  </text>
  
  <!-- Accent decoration -->
  <circle cx="1050" cy="150" r="120" fill="#10b981" opacity="0.06"/>
  <circle cx="1100" cy="480" r="80" fill="#3b82f6" opacity="0.06"/>
</svg>
